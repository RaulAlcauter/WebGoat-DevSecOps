name: Maven DevSecOps CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: SAST - Semgrep
      run: |
        docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan --config auto src/
            
    - name: Secret Scanning - TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --results=verified,unverified,unknown

    - name: IaC Scanning - KICS
      uses: checkmarx/kics-github-action@v2.1.20
      with:
        path: 'Dockerfile'
        output_path: 'kics_results'
        output_formats: 'json'
        ignore_on_exit: results
        
    - name: Upload KICS report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kics-report
        path: kics_results/
        if-no-files-found: warn

    - name: SCA - Dependency Check
      run: |
          echo "Aquí ejecutaremos Dependency-Check"
