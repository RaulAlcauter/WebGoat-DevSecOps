name: Maven DevSecOps CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: SAST - Semgrep
      run: |
        docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan --config auto src/
            
    - name: Secret Scanning - TruffleHog
      uses: trufflesecurity/trufflehog@v3.99.7

    - name: IaC Scanning - KICS
      run: |
          echo "Aquí ejecutaremos KICS"

    - name: SCA - Dependency Check
      run: |
          echo "Aquí ejecutaremos Dependency-Check"
