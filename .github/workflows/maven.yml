name: Maven DevSecOps CI/CD Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Configure JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Cache Dependency-Check database
      uses: actions/cache@v6.1.0
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data/
        key: dependency-check-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          dependency-check-${{ runner.os }}-

    - name: SCA - OWASP Dependency-Check
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: |
        ./mvnw -B \
          org.owasp:dependency-check-maven:13.0.0:check \
          -Dformat=JSON \
          -DprettyPrint=true \
          -Dodc.outputDirectory=dependency-check-report \
          -DfailBuildOnCVSS=11 \
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

    - name: Upload Dependency-Check report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Dependency-Check Report
        path: dependency-check-report/
        if-no-files-found: warn

    - name: SAST - Semgrep
      run: |
        mkdir -p semgrep_results
        docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan --config auto \
            --json \
            --output semgrep_results/semgrep.json \
            src/

    - name: Upload Semgrep report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Semgrep Report
        path: semgrep_results/
        if-no-files-found: warn

    - name: Secret Scanning - TruffleHog
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/src" \
          -w /src \
          trufflesecurity/trufflehog:latest \
          git file://./ --results=verified,unverified,unknown --json > trufflehog-report.json

    - name: Upload TruffleHog report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Trufflehog Report
        path: trufflehog-report.json
        if-no-files-found: warn

    - name: IaC Scanning - KICS
      uses: checkmarx/kics-github-action@v2.1.20
      with:
        path: 'Dockerfile'
        output_path: 'kics_results'
        output_formats: 'json'
        ignore_on_exit: results

    - name: Upload KICS report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: KICS Report
        path: kics_results/
        if-no-files-found: warn

  build:
    name: Build
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Build JAR
      run: |
        ./mvnw clean package -DskipTests -B
    
    - name: Build, and tag WebGoat image
      run: |
        IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/webgoat-devsecops"
        docker build -t "$IMAGE_NAME:$GITHUB_SHA" -t "$IMAGE_NAME:latest" .

        echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
    
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}  

    - name: Push image to GHCR
      run: |
        docker push "$IMAGE_NAME:$GITHUB_SHA"
        docker push "$IMAGE_NAME:latest"
  
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - name: Run WebGoat tests
      run: |
        ./mvnw test -B
