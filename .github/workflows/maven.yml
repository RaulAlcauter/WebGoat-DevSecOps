name: Maven DevSecOps CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: SAST - Semgrep
      run: |
        mkdir -p semgrep_results
        docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan --config auto \
            --json \
            --output semgrep_results/semgrep.json \
            src/

    - name: Upload Semgrep report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Semgrep Report
        path: semgrep_results/
        if-no-files-found: warn

    - name: Secret Scanning - TruffleHog
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/src" \
          -w /src \
          trufflesecurity/trufflehog:latest \
          git file://./ --results=verified,unverified,unknown --json > trufflehog-report.json
      continue-on-error: true

    - name: Upload TruffleHog report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Trufflehog Report
        path: trufflehog-report.json
        if-no-files-found: warn

    - name: IaC Scanning - KICS
      uses: checkmarx/kics-github-action@v2.1.20
      with:
        path: 'Dockerfile'
        output_path: 'kics_results'
        output_formats: 'json'
        ignore_on_exit: results

    - name: Upload KICS report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: KICS Report
        path: kics_results/
        if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Build JAR
      run: |
        ./mvnw clean package -DskipTests -B

    - name: Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      env:
        JAVA_HOME: /opt/jdk
      with:
        project: 'WebGoat'
        path: '.'
        format: 'JSON'
        out: 'dependency-check-report'

    - name: Upload Dependency Check Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Dependency Check Report
        path: dependency-check-report/
        if-no-files-found: warn
    
    - name: Build WebGoat image
      run: |
        docker build -t webgoat:1.0 .

